<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111111">

  <title>Fuel — Nutrition Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #111;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 22px;
    }

    h1 {
      margin-bottom: 4px;
      font-size: 34px;
    }

    .subtitle {
      color: #777;
      margin-top: 0;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .calories {
      font-size: 42px;
      font-weight: 750;
      margin: 8px 0;
    }

    .muted {
      color: #777;
    }

    .progress {
      height: 12px;
      background: #e8e8ed;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 15px;
    }

    .progress-bar {
      height: 100%;
      background: #111;
      width: 0%;
      transition: .3s;
    }

    .macros {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 16px;
    }

    .macro {
      background: #f5f5f7;
      border-radius: 16px;
      padding: 14px 8px;
      text-align: center;
    }

    .macro strong {
      display: block;
      font-size: 19px;
      margin-bottom: 3px;
    }

    input, select, button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      margin-top: 9px;
    }

    input, select {
      background: #f2f2f4;
    }

    button {
      background: #111;
      color: white;
      font-weight: 650;
      cursor: pointer;
    }

    .secondary {
      background: #ececef;
      color: #111;
    }

    .food {
      padding: 13px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .food:last-child {
      border-bottom: none;
    }

    .food-name {
      font-weight: 650;
    }

    .food-details {
      font-size: 13px;
      color: #777;
      margin-top: 3px;
    }

    .delete {
      width: auto;
      padding: 7px 10px;
      margin: 0;
      background: #f1f1f3;
      color: #777;
      font-size: 12px;
    }

    .remaining {
      font-size: 15px;
      margin-top: 12px;
      color: #555;
    }

    .date {
      font-size: 14px;
      color: #777;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Fuel.</h1>
  <p class="subtitle">Eat. Train. Progress.</p>

  <div class="card">
    <div class="date" id="date"></div>
    <div class="muted">Calories eaten</div>

    <div class="calories">
      <span id="calories">0</span>
      <span style="font-size:18px;color:#888;"> / 2350</span>
    </div>

    <div class="progress">
      <div class="progress-bar" id="progress"></div>
    </div>

    <div class="remaining">
      <strong id="remainingCalories">2350</strong> calories remaining
    </div>

    <div class="macros">

      <div class="macro">
        <strong id="protein">0g</strong>
        Protein
        <div class="muted">Goal 180g</div>
      </div>

      <div class="macro">
        <strong id="carbs">0g</strong>
        Carbs
        <div class="muted">Goal 250g</div>
      </div>

      <div class="macro">
        <strong id="fat">0g</strong>
        Fat
        <div class="muted">Goal 70g</div>
      </div>

    </div>
  </div>


  <div class="card">
    <h2>Quick Add</h2>

    <input id="foodName" placeholder="Food — e.g. Ground beef">

    <select id="meal">
      <option>Breakfast</option>
      <option>Lunch</option>
      <option>Pre-Workout</option>
      <option>Dinner</option>
      <option>Snack</option>
    </select>

    <input id="calInput" type="number" inputmode="decimal" placeholder="Calories">

    <input id="proteinInput" type="number" inputmode="decimal" placeholder="Protein (g)">

    <input id="carbInput" type="number" inputmode="decimal" placeholder="Carbs (g)">

    <input id="fatInput" type="number" inputmode="decimal" placeholder="Fat (g)">

    <button onclick="addFood()">Add Food</button>
  </div>


  <div class="card">
    <h2>Today's Food</h2>

    <div id="foodList">
      <div class="muted">Nothing logged yet.</div>
    </div>
  </div>


  <div class="card">
    <h2>Daily Targets</h2>

    <p>
      <strong>2,350 calories</strong><br>
      180g protein · 250g carbs · 70g fat
    </p>

    <button class="secondary" onclick="resetDay()">
      Reset Today's Log
    </button>
  </div>

</div>


<script>

const targets = {
  calories: 2350,
  protein: 180,
  carbs: 250,
  fat: 70
};

const today = new Date().toISOString().split("T")[0];

document.getElementById("date").innerText =
  new Date().toLocaleDateString(undefined, {
    weekday: "long",
    month: "long",
    day: "numeric"
  });

let foods = JSON.parse(
  localStorage.getItem("fuel-" + today)
) || [];


function addFood() {

  const name =
    document.getElementById("foodName").value.trim();

  if (!name) {
    alert("Enter a food name first.");
    return;
  }

  const food = {
    name: name,
    meal: document.getElementById("meal").value,
    calories:
      Number(document.getElementById("calInput").value) || 0,
    protein:
      Number(document.getElementById("proteinInput").value) || 0,
    carbs:
      Number(document.getElementById("carbInput").value) || 0,
    fat:
      Number(document.getElementById("fatInput").value) || 0
  };

  foods.push(food);

  save();

  document.getElementById("foodName").value = "";
  document.getElementById("calInput").value = "";
  document.getElementById("proteinInput").value = "";
  document.getElementById("carbInput").value = "";
  document.getElementById("fatInput").value = "";

  render();
}


function deleteFood(index) {

  foods.splice(index, 1);

  save();
  render();
}


function save() {

  localStorage.setItem(
    "fuel-" + today,
    JSON.stringify(foods)
  );
}


function render() {

  let calories = 0;
  let protein = 0;
  let carbs = 0;
  let fat = 0;

  foods.forEach(food => {

    calories += food.calories;
    protein += food.protein;
    carbs += food.carbs;
    fat += food.fat;

  });

  document.getElementById("calories").innerText =
    Math.round(calories);

  document.getElementById("protein").innerText =
    Math.round(protein) + "g";

  document.getElementById("carbs").innerText =
    Math.round(carbs) + "g";

  document.getElementById("fat").innerText =
    Math.round(fat) + "g";

  document.getElementById("remainingCalories").innerText =
    Math.max(0, Math.round(targets.calories - calories));

  const percent =
    Math.min(100, (calories / targets.calories) * 100);

  document.getElementById("progress").style.width =
    percent + "%";


  const list = document.getElementById("foodList");

  if (foods.length === 0) {

    list.innerHTML =
      '<div class="muted">Nothing logged yet.</div>';

    return;
  }


  list.innerHTML = foods.map((food, index) => `

    <div class="food">

      <div>

        <div class="food-name">
          ${food.name}
        </div>

        <div class="food-details">
          ${food.meal} ·
          ${Math.round(food.calories)} cal ·
          ${Math.round(food.protein)}P ·
          ${Math.round(food.carbs)}C ·
          ${Math.round(food.fat)}F
        </div>

      </div>

      <button
        class="delete"
        onclick="deleteFood(${index})">
        Remove
      </button>

    </div>

  `).join("");
}


function resetDay() {

  if (confirm("Delete today's food log?")) {

    foods = [];

    save();
    render();

  }
}


render();

</script>

</body>
</html>
